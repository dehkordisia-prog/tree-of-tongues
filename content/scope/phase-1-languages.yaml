# Phase 1 scope list: the 100 languages of the first vertical slice.
#
# Provenance: Selection follows the order of a third-party reference chart (Ethnologue 200 based, 2026, kept locally);
# only names and ranks were used; no figures. The chart, any crop of it and its speaker numbers are never committed (D-009).
# Names were transcribed by data-curator on 2026-11-10 from full-resolution crops of the chart's ranked list; no name was
# unreadable. `chart_name` is the name as printed (the chart prints capitals; stored in title case). `rank` is the printed number.
#
# Mapping target: Glottolog 5.3 (Zenodo 10.5281/zenodo.18840967, CC BY 4.0) as built into data/build/*.parquet (D-001, D-002).
# Cross-references (ISO 639-3, Wikidata QID) are copied from that build, never typed from memory. The chart prints no codes,
# so "ISO match" means the ISO 639-3 code that the ISO standard gives the chart's language name, looked up in the xrefs table.
#
# How to read an entry
#   display_name          the name the UI shows (D-004). chart_name is the name as printed; alternate_names are search aliases.
#   glottocode            the Glottolog node for the default view. For contested entries it is the language-level node
#                         recommended by linguist-reviewer (rule Q1). Null only for rank 91 (Deccan).
#   confidence            high, medium, low or contested. contested means scholars disagree about lumping or classification;
#                         the node is still set. node_confidence says how sure the node identity is.
#   lumper_group          (contested only) the Lumper/Splitter group (see lumper_groups), or none.
#   inspector_note        (contested only) one plain-English line for the Inspector's "Why linguists disagree".
#   mechanical_candidate  (contested only) the node an exact-name or ISO match would pick. Not a decision. Null if none fits.
#   candidates            (contested only) every plausible node with its level, ISO code and Wikidata QID.
#   retired_iso / qid_note  a retired ISO code kept for traceability; why a QID is null or shared (the pipeline fills it).
#   family_path           top-level Glottolog family (D-002), not the chart's grouping. The chart is a labeled alternative lens only.
#   families              family-level nodes above every entry and candidate, for the tree.

