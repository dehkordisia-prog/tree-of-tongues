- id: persian_grouping
  status: pending
  question: Does the atlas show Persian as one pluricentric language (Iran, Afghanistan, Tajikistan) in the lumped view, and
    is Tajik in it? Applies to lumper_groups.persian.
- id: farsic_family_labels
  status: pending
  question: Which English display labels do the Glottolog family nodes Farsic (fars1255), Eastern Farsic (east2745) and Farsic-Caucasian
    Tat (fars1254) get? D-004 forbids the ASCII spelling as a UI name, and fars1254 also contains Caucasian Tat, so it cannot
    simply be called Persian. No labels are invented here.

