name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm lint:content
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
