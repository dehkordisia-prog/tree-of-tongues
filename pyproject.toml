[project]
name = "tree-of-tongues-pipeline"
version = "0.1.0"
description = "Data pipeline for Tree of Tongues: fetch, normalize, build and validate open language data."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "pandera[polars]==0.35.0",
  "polars==2.1.0",
  "pyarrow==26.0.1",
  "pycldf==2.1.1",
  "pyyaml==6.0.3",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "reference", "node_modules", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
