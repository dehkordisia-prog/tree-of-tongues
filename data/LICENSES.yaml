    license_url: "https://openfontlicense.org/open-font-license-official-text/"
    attribution: >-
      Source Sans 3 by Paul D. Hunt for Adobe. Copyright 2010-2020 Adobe,
      with Reserved Font Name "Source". Source is a trademark of Adobe in the
      United States and/or other countries. SIL Open Font License 1.1.
    components:
      - "apps/web/public/fonts/source-sans-3/: 9 unicode-range slices (roman: latin, latin-ext, cyrillic, cyrillic-ext, greek, greek-ext, vietnamese; italic: latin, latin-ext), wght axis"
    share_alike: true
    non_commercial: false
    no_derivatives: false
    restrictions:
      - "OFL 1.1 condition 2: every copy must carry the copyright notice and the license. Keep OFL.txt beside the files."
      - "OFL 1.1 condition 3: Reserved Font Name 'Source'. A Modified Version may not use it as the primary font name without written permission from Adobe."
      - "OFL 1.1 condition 1: the font may not be sold by itself."
      - "OFL 1.1 condition 4: do not use Adobe's name to promote the project, beyond acknowledgement."
      - "Source is a trademark of Adobe. Credit only; no implied endorsement."
    status: blocked
    verified_on: 2026-11-10
    verified_url:
      - "https://raw.githubusercontent.com/adobe-fonts/source-sans/release/LICENSE.md"
      - "https://github.com/adobe-fonts/source-sans/releases/latest"
      - "https://raw.githubusercontent.com/google/fonts/main/ofl/sourcesans3/OFL.txt"
      - "https://raw.githubusercontent.com/google/fonts/main/ofl/sourcesans3/METADATA.pb"
      - "https://registry.npmjs.org/@fontsource-variable/source-sans-3"
      - "https://openfontlicense.org/ofl-faq/"
      - "https://openfontlicense.org/webfonts-and-reserved-font-names/"
    notes: >-
      BLOCKER (RFN). RFN 'Source' is declared in upstream LICENSE.md
      (2010-2024 Adobe), in Google's OFL.txt (2010-2020) and in the font's
      own copyright string per METADATA.pb ("2023 Adobe ... with Reserved
      Font Name 'Source'"). Fontsource slices are pre-made unicode-range
      subsets of Google's build. The SIL webfonts paper states that
      pre-subsetting is a Modified Version "because these subsets do not
      deliver complete functionality", so the name "Source Sans 3" may not be
      kept without Adobe's written permission. No public permission found.
      Any Google agreement would not extend to us (FAQ 2.12). Practical
      enforcement risk is low, but the project standard is strict
      compliance. Fix options: (a) serve Adobe's official unmodified WOFF2
      variable files (Upright and Italic) from release 3.052R; (b) our own
      renamed subset; (c) written permission from Adobe. OFL.txt matches
      Google's copy verbatim; its year range (2010-2020) differs from
      upstream (2010-2024) and from the in-font string (2023). Use the line
      that matches whichever binary ships.

