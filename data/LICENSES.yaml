      - "Media referenced by Wikidata statements (images, audio such as pronunciation files, maps on Wikimedia Commons) is NOT CC0. Each file carries its own license and needs its own entry or per-file record before use."
      - "User-Agent policy: send a descriptive User-Agent of the form '<client>/<version> (<contact URL or email>) <library>/<version>'. Do not use generic agents (curl, python-requests, Python-urllib) or copy a browser UA. Non-compliant clients may be blocked without notice or get HTTP 403. Browser JavaScript uses the Api-User-Agent header."
