# data/LICENSES.yaml
# Rights register for Tree of Tongues. Maintained by rights-auditor only.
#
# Schema (schema_version 1):
#   schema_version: integer
#   sources:  list of data sources. Every source_id used in data rows,
#             data/raw/MANIFEST.yaml or content citations MUST equal the `id`
#             of exactly one entry here. A validator should fail on unknown ids,
#             duplicate ids and missing required keys.
#   assets:   asset classes (fonts, images, audio). Same keys as a source, plus
#             `kind`. Fonts filed 2026-11-10. Audio class rule filed
#             2026-11-10 (audio-wikimedia-commons); clips are per-file records.
#
# Required keys per entry:
#   id               short, stable, lowercase, [a-z0-9.-]+ ; never reuse or rename
#   name             human-readable name
#   version          release / version string, or "rolling" for live services
#   url              canonical landing page of the exact version used
#   doi              DOI string or null
#   license          SPDX id where one exists (e.g. CC-BY-4.0, CC0-1.0,
#                    Unicode-3.0); otherwise "LicenseRef-<name>"
#   license_url      URL of the license text
#   attribution      text the app displays (credits page and source chips)
#   share_alike      bool: derived files must carry the same license
#   non_commercial   bool: no commercial use (project is non-commercial forever)
#   no_derivatives   bool: only link or show unmodified
#   restrictions     list of strings: access protocols, rate limits, notices,
#                    anything beyond the license itself ([] if none)
#   status           cleared | cleared-with-conditions | blocked | pending
#   verified_on      ISO date the terms were checked at the source
#   verified_url     list of URLs where the terms were read on verified_on
#   notes            free text: discrepancies, risks, handling rules
# Optional keys: citation (formal bibliographic citation), components
#   (sub-parts actually used), kind (assets only).

schema_version: 1

