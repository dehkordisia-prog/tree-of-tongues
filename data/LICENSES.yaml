      RFN 'Source' is declared in Google's OFL.txt and in the font's own
      copyright string ("(c) 2014-2021 Adobe ... with Reserved Font Name
      'Source'"). The noto-cjk Sans/LICENSE has the bare OFL text with no
      copyright line and no RFN. Either way the RFN is "Source", and the
