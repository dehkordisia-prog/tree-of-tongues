    notes: >-
      Status covers the class and the rule, not any file. Commons:Licensing
      says NC-only media are not accepted and marks CC BY-ND "Not OK"; such
      licences are allowed only when the work is also offered under a
      permitted licence. Commons:Reusing_content_outside_Wikimedia: credit
      the creator (author field), name the licence, follow the creator's
      attribution wishes; the Foundation gives no warranty on licences; if
      no licence suits, use a different file. It also warns that
      personality and privacy rights can apply apart from copyright. Sample
      file LL-Q9168 (fas)-Darafsh-sifr.wav: Lingua Libre record template
      with speaker profile Q812710, author Darafsh, date 2022-10-24, licence
      {{cc-zero}}; extmetadata LicenseShortName "CC0", Artist "Speaker:
      Darafsh ... Recorder: Darafsh", Credit "Own work (Lingua Libre)",
      Restrictions empty. That is the field set the per-file record uses.
      Rate limit page last edited 2026-11-08 and says the limits are new in
      2026 and may change; re-check before each bulk fetch. Robot policy
      last edited 2026-03-16. LINGUA LIBRE: lingualibre.org returned HTTP
      503 or dropped the connection, and archive.lingualibre.org refused the
      connection on 2026-11-10, so its own terms and copyright pages were
      NOT read. Search results quoting the RecordWizard manual say speakers
      choose CC0 1.0, CC BY 4.0 or CC BY-SA 4.0, with CC BY-SA 4.0 as the
      default. That is unverified at the source. DATA_SOURCES.md says "CC
      BY-SA 4.0" for Lingua Libre; in fact the licence varies per file, and
      the per-file rule handles that. Because files live on Commons and we
      fetch only through the Commons API, Lingua Libre's site terms do not
      gate this work; re-read them when the site is back. share_alike is
      true for the class because many clips are CC BY-SA; each clip's own
      record decides.
