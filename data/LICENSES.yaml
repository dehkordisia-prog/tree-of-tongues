      versions) 10.5281/zenodo.3835822; isSupplementTo
      github.com/lexibank/asjp/tree/v21.1. The earlier v21 release
      (10.5281/zenodo.16736409, 2025-08-04, CC BY 4.0) holds the same ASJP
      v21 data. We choose v21.1 because its cldf-metadata.json lists
      Glottolog v5.3 (our backbone), Concepticon v3.4.0 and CLTS v2.3.0 in
      its provenance. asjp.clld.org (app v2026.11) states CC BY 4.0 and asks
      for the five-editor citation; the README asks users to cite that and
      also the DOI of the release used. Release counts per README: 11,540
      doculects, 6,126 distinct Glottocodes, 568,820 forms, 100 concepts.
      The 40-item subset is not flagged in parameters.csv. data-curator must
      take the 40 concept list from a cited source (for example the
      Concepticon list for Holman et al. 2008, 40 items); if that list comes
      from Concepticon, file Concepticon here first. DATA_SOURCES.md says
      "CC BY 4.0", which matches. The clld app's own Zenodo record (software)
      is Apache 2.0; that covers code we do not use. "What is ASJPcode?"
      should link to an explanation written by us with a citation to Brown
      et al. 2008 (content-writer and linguist-reviewer), not to a copied
      text.

  - id: ethnologue
    name: "Ethnologue: Languages of the World (SIL International), direct use"
    version: "29th edition (2026) per DATA_SOURCES.md; not accessed"
    url: "https://www.ethnologue.com"
    doi: null
    license: LicenseRef-Ethnologue-Terms-Proprietary
    license_url: "https://shop.ethnologue.com/policies/terms-of-service"
    attribution: "Ethnologue: Languages of the World, SIL International. Named only as the reference inside a Wikidata statement."
    share_alike: false
    non_commercial: false
    no_derivatives: true
    restrictions:
      - "BLOCKED for direct use. No download, scraping, copying, subscription use or manual transcription of Ethnologue content into the project. This includes the reference chart's speaker figures (docs/plans/phase-1.md step 1)."
      - "General Terms of Use: 'You may not republish, reproduce or reuse any Content from Ethnologue's website unless there is an express exception or separate license'; no 'mirroring, scraping or copying any Content'; fair use copies 'for research or educational purposes only', capped at '1,000 words per project'."
      - "Product Terms: 'You may not redistribute any portion of this work in any form, including ingesting the contents into a database that is shared with others or posting it on a web site'."
      - "Section 9 of the terms lists sui generis database rights among SIL's claimed rights."
      - "Do not copy Ethnologue figures into Wikidata ourselves to reuse them (laundering). No project member edits Wikidata P1098 with an Ethnologue reference."
      - "VIA WIKIDATA (allowed, conditions): see the rule in notes. The source of record is wikidata (CC0), not this entry."
    status: blocked
    verified_on: 2026-11-10
    verified_url:
      - "https://shop.ethnologue.com/policies/terms-of-service"
      - "https://www.wikidata.org/wiki/Wikidata:Licensing"
      - "https://www.wikidata.org/wiki/Special:EntityData/Q115923483.json"
      - "https://www.wikidata.org/wiki/Special:EntityData/Q125535932.json"
    notes: >-
      ethnologue.com/terms-of-use/, ethnologue.com/terms-use/ and
      ethnologue.com/academic-terms-use all returned HTTP 403 to our
      fetcher on 2026-11-10. The same General Terms and Product Terms were
      read on shop.ethnologue.com/policies/terms-of-service, which names the
      contracting party as Summer Institute of Linguistics, Inc. and covers
      "all information, data, and other content" of the Ethnologue Platform.
      No "last updated" date is shown (footer: 2026). The page was cut off
      at the end; later sections were not read. WHY VIA-WIKIDATA DISPLAY IS
      ACCEPTABLE: (1) the terms are a contract with users of the Ethnologue
      Platform; we never use the Platform, so we accept no Ethnologue terms;
      (2) single figures are facts, which Wikidata:Licensing (last edited
      2026-09-24) says are generally not eligible for copyright, and
      Wikidata publishes them under CC0; (3) the residual risk is database
      right on a substantial extraction; SIL is a US entity, and 100 to a
      few hundred single figures shown per language is an insubstantial
      part of a 7,000+ language database. This is a risk judgement, not
      legal advice. Wikidata:Licensing also notes that the community avoids
      integrating datasets "without considering whether those copyright
      claims are legitimate", so these statements are tolerated, not
      endorsed. RULE (pipeline and UI apply it mechanically): (a) Flag. In
      the build, set via_ethnologue = true on a speaker statement when any
      reference has P248 = Q14790, or P248 = X where X has P629 = Q14790
      (edition items such as Q115923483, 25th edition), or P854 with host
      ethnologue.com or *.ethnologue.com, or P1627 in the reference. The
      same flag applies to P3823 (Ethnologue language status) values if they
      are ever used. (b) Label. Source chip text: "Wikidata, stated in
      Ethnologue (25th edition, 2022)" using P393 (edition number) and the
      year of P577 (publication date) of the edition item; "Wikidata,
      stated in Ethnologue (edition not given)" when P248 is Q14790 itself
      or the edition has no P393 or P577. The figure's own year is P585
      (point in time) as for any statement; never infer it from the edition.
      (c) Link. The chip links to the Wikidata statement
      (https://www.wikidata.org/wiki/<QID>#P1098). No link to Ethnologue
      language pages, no Ethnologue logo. (d) Display scope. Shown in that
      language's Speakers tab, At a glance range and tree bubble like any
      other figure, one language at a time. Never averaged (D-005). (e) No
      bulk. via_ethnologue rows live in their own build file (for example
      speakers.via-ethnologue.parquet) with this entry's id beside it. They
      are excluded from any dataset download, export, API or "download the
      data" feature, and from any list that ranks languages by these
      figures alone. (f) No checking. Nobody fills, corrects or verifies a
      figure against Ethnologue. (g) Review trigger. Re-review when the
      count of via_ethnologue rows shipped exceeds 1,000 or the scope
      passes 1,000 languages. Licence id is LicenseRef because there is no
      open licence; no_derivatives is set true to stop any reuse beyond
      the via-Wikidata rule.

  - id: iso-639-3-sil
    name: "ISO 639-3 code tables from the Registration Authority (SIL International), iso639-3.sil.org"
    version: "not accessed"
    url: "https://iso639-3.sil.org/code_tables/download_tables"
    doi: null
    license: LicenseRef-ISO-639-3-Terms
    license_url: "https://iso639-3.sil.org/code_tables/download_tables"
    attribution: "ISO 639-3 Registration Authority, SIL International, https://iso639-3.sil.org"
    share_alike: false
    non_commercial: false
    no_derivatives: true
    restrictions:
      - "Do not download, commit or ship the SIL code tables (iso-639-3.tab, iso-639-3-macrolanguages.tab, retirements) until the terms page is read by a person and recorded here."
      - "Secondary evidence only (not verified at the source): the terms reportedly allow use in commercial and non-commercial systems with attribution to iso639-3.sil.org and without modification, on condition that 'the product, system, or device does not provide a means to redistribute the code set' (quoted by Robert Forkel, W3C public-ontolex list, 2020-07-08). A static site that serves the tables would breach that."
      - "ISO codes as cross-references are cleared through other sources: Glottolog 5.3 languages.csv ISO639P3code (CC BY 4.0), Wikidata P220 (CC0), ASJP ISO639P3code (CC BY 4.0). Macrolanguage links for the scope list come from CLDR 49 supplemental/aliases.json languageAlias entries with _reason 'macrolanguage' (Unicode-3.0), Wikidata, or our own reviewed mapping in content/scope/phase-1-languages.yaml. Each code carries the source it came from."
    status: pending
    verified_on: 2026-11-10
    verified_url:
      - "https://lists.w3.org/Archives/Public/public-ontolex/2020Jul/0007.html"
      - "https://clldutils.readthedocs.io/en/stable/iso_639_3.html"
      - "https://raw.githubusercontent.com/unicode-org/cldr-json/49.0.0/cldr-json/cldr-core/supplemental/aliases.json"
    notes: >-
      iso639-3.sil.org/code_tables/download_tables and
      .../download_tables/terms_of_use returned HTTP 403 to our fetcher on
      2026-11-10. We did not use proxies or mirrors to get around the block.
      The Wayback Machine was not reachable from our tools. clldutils (used
      by the CLDF tooling) states that it does not distribute the ISO tables
      and fetches them from SIL on demand, which is consistent with a
      no-redistribution clause. A single ISO 639-3 code is an identifier
      (a fact), and Glottolog, Wikidata and CLDR already publish codes and
      some macrolanguage relations under open terms, so shipping codes as
      cross-references does not need the SIL tables. CLDR's macrolanguage
      aliases are partial (about 60 pairs, those where the macrolanguage is
      the canonical locale, for example pes to fa, arb to ar, cmn to zh, swh
      to sw); they are not the full SIL mapping. To clear this entry, Siavash
      (or another person in a browser) reads the terms page and records the
      wording and date here, or we ask iso639-3@sil.org in writing.

# Asset classes (fonts, images, audio). Entries are added by later requests.
# Each asset entry uses the source keys above plus `kind: font|image|audio`.
#
# Font conventions:
#   license      OFL-1.1-RFN when the copyright statement (OFL.txt or the font's
#                own name table) declares a Reserved Font Name, else
#                OFL-1.1-no-RFN. Both are SPDX ids for the same OFL 1.1 text.
#   share_alike  true for every OFL font: the font and any derivative must stay
#                under OFL 1.1 (condition 5). Documents and pages that merely use
#                the font are not affected.
#   RFN rule     Per OFL FAQ 2.6 to 2.8 and the SIL paper "Webfonts and Reserved
#                Font Names", pre-made subsets (including unicode-range slices)
#                and axis-instanced files are Modified Versions. A Modified
#                Version may not carry a Reserved Font Name without the holder's
#                written permission. Unmodified upstream files and pure WOFF/WOFF2
#                wrapping of unchanged font data may keep the name (FAQ 2.2.1).
assets:
  # The two entries below keep their original ids (ids never change). Each id
  # names the upstream work and its license, which are unchanged. What ships
  # changed on 2026-11-10: the blocked Fontsource slices were removed and
  # replaced by our own renamed subsets. History is kept in notes.
  - id: font-source-serif-4
