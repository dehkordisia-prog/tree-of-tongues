    status: cleared-with-conditions
    verified_on: 2026-11-10
    verified_url:
      - "https://zenodo.org/api/records/22957986"
      - "https://zenodo.org/api/records/16736409"
      - "https://github.com/lexibank/asjp/releases"
      - "https://raw.githubusercontent.com/lexibank/asjp/v21.1/README.md"
      - "https://raw.githubusercontent.com/lexibank/asjp/v21.1/cldf/cldf-metadata.json"
      - "https://asjp.clld.org/"
      - "https://asjp.clld.org/legal"
    notes: >-
      Zenodo record 22957986: "CLDF dataset derived from Wichmann et al.'s
      "ASJP Database" v21 from 2025", version v21.1, published 2026-09-25,
