      1997-2026; keep 2025 while we ship 7.000. Version 7 renamed the family
      from "Charis SIL" to "Charis"; use "Charis" in credits. Any future
      subset (the planned 60 KB IPA subset) is a Modified Version and must be
      renamed without "Charis" or "SIL", keep the SIL copyright line and stay
      under OFL 1.1. Bold and italic are synthesized by the browser; that is
      rendering, not modification. id keeps "sil" because ids never change.

