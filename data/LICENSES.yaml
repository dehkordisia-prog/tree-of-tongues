  # Audio. This is an asset CLASS entry with the per-file rule. Individual
  # clips are NOT filed here; each clip gets a per-file record (see
  # restrictions) and rights-auditor clears each one before it ships.
  - id: audio-wikimedia-commons
    kind: audio
    name: "Word recordings on Wikimedia Commons, including Lingua Libre uploads (Sounds tab: greeting and numbers 1 to 10)"
    version: "rolling (each file is recorded with its page revision id and retrieval date)"
    url: "https://commons.wikimedia.org/wiki/Category:Lingua_Libre_pronunciation"
    doi: null
    license: LicenseRef-Per-File
    license_url: "https://commons.wikimedia.org/wiki/Commons:Licensing"
    attribution: >-
      Per clip: "<file title>" by <speaker> (recorded by <recorder>),
      <license short name>, via Wikimedia Commons, <file page URL>. Lingua
      Libre clips add "recorded with Lingua Libre".
    share_alike: true
    non_commercial: false
    no_derivatives: false
    restrictions:
      - "PER-FILE RECORD (required before a clip ships): file page URL; file title; page revision id; original file URL and sha1 from imageinfo; speaker (name as shown, Lingua Libre speaker QID if any); recorder or uploader account; license short name, version and license URL exactly as in extmetadata LicenseShortName and LicenseUrl; Credit field; Restrictions field; consent status (self-recorded, stated, or not shown); language as given on the page (Lingua Libre language QID) and the variety; transcription as given; recording date (DateTimeOriginal); retrieval date; rights-auditor clearance date."
      - "ACCEPT: CC0 1.0; public domain tags with a stated reason; CC BY 1.0 to 4.0; CC BY-SA 1.0 to 4.0. Where a file is multi-licensed, pick CC0, then CC BY, then CC BY-SA, and record the choice."
      - "REJECT: any NC or ND licence (Commons does not accept them alone, so seeing one means the page is wrong or the file is not on Commons); GFDL-only (it requires the full licence text with each copy, which a clip cannot carry; accept when dual-licensed with CC); Free Art License and other licences not listed above until rights-auditor files them; no licence tag, 'no permission', 'no source', a deletion or copyright-violation notice, or a licence that differs between wikitext and extmetadata."
      - "REJECT when the Restrictions field is not empty (personality rights, trademark and similar) until rights-auditor reviews the file."
      - "CONSENT: Phase 1 ships only 'self-recorded' clips (the speaker's Lingua Libre profile belongs to the uploading account) or 'stated' (the page states the speaker's permission or carries a VRT ticket). 'Not shown' clips go to rights-auditor one by one. Never use clips of minors, sacred or restricted material, or recordings taken from broadcasts."
      - "VARIETY: Lingua Libre groups some varieties under one language item. Example seen 2026-11-10: Category:Lingua_Libre_pronunciation-fas (Q9168) holds Cyrillic-script words. Record the variety from the speaker profile; linguist-reviewer confirms it before the clip is attached to a Glottocode."
      - "DERIVED FILES AND SHARE-ALIKE: our Opus file and peaks JSON inherit the source clip's exact licence and version, CC0 included. Transcoding alone is a technical modification (CC BY-SA 4.0 s. 2(a)(4)); trimming silence or loudness normalising is treated as adaptation to be safe. Either way the derived file carries the same licence. Store each clip as its own Opus file and its own peaks file, with a sidecar <clip>.license.json (or one row per clip in a manifest shipped beside them) holding the per-file record and attribution. Never concatenate clips into sprites or bundles, never mix CC BY-SA clips into one file with clips under other licences, and never relicense a clip under the repo's MIT or CC BY-SA terms. No DRM or extra terms on any clip (CC BY-SA 4.0 s. 3(b)(3))."
      - "INDICATE CHANGES: the clip's credit says 'converted to Opus' and lists any trim or normalisation."
      - "DISPLAY: every Audio button sits beside the Recording badge and a credit line with speaker, licence (linked) and a link to the file page."
      - "FETCH: through the Commons Action API by category and by title, never by scraping lingualibre.org. User-Agent per the Wikimedia policy, with contact details (see wikidata entry). Unauthenticated bots with a compliant User-Agent: 200 requests per minute. Media from upload.wikimedia.org: total concurrency at most 2, at most 25 Mbps. Use originals, not custom sizes. Keep raw files under data/raw/ with sha1 checked against imageinfo."
      - "The app never hotlinks Commons media; it plays our own Opus copies."
