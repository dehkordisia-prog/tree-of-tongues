      - "https://www.mediawiki.org/wiki/Wikidata_Query_Service/User_Manual"
      - "https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy"
    notes: >-
      Attribution is not legally required under CC0; we credit anyway.
      User-Agent policy page last edited 2026-03-27. Facts in Wikidata keep
      their own provenance: store the referenced source (stated in, URL,
      retrieval date) and qualifiers such as point in time alongside each
      speaker figure, and show it. DATA_SOURCES.md lists "images" as a
      Wikidata yield under CC0; that is incorrect for the image files
      themselves (see restrictions).

  - id: natural-earth-5.1.1
    name: "Natural Earth vector data, Admin 0 Countries"
    version: "5.1.1"
    url: "https://www.naturalearthdata.com/downloads/"
    doi: null
    license: LicenseRef-PublicDomain
    license_url: "https://www.naturalearthdata.com/about/terms-of-use/"
    attribution: "Made with Natural Earth. Free vector and raster map data @ naturalearthdata.com."
    components:
      - "ne_110m_admin_0_countries (1:110m), version 5.1.1"
      - "ne_50m_admin_0_countries (1:50m), version 5.1.1"
    share_alike: false
    non_commercial: false
    no_derivatives: false
    restrictions:
      - "None legally. Terms say all raster and vector data on the site is public domain, no permission needed, credit unnecessary. We credit anyway with the suggested line."
      - "Point of view: Natural Earth draws de facto boundaries (who controls the territory), not de jure. That is a stance, not neutrality. Our maps must apply the project's neutral disputed-territory rendering on top (see notes)."
    status: cleared-with-conditions
    verified_on: 2026-11-10
    verified_url:
      - "https://www.naturalearthdata.com/about/terms-of-use/"
      - "https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/"
      - "https://www.naturalearthdata.com/downloads/50m-cultural-vectors/50m-admin-0-countries-2/"
      - "https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-admin-0-countries/"
    notes: >-
      Both requested scales (1:110m and 1:50m) are public domain like all
      Natural Earth data; any scale is fine rights-wise. Current version is
      5.1.1 at both scales. Disputed areas: the download pages state that
      boundaries are de facto by default and invite users to combine the
      separate "breakaway and disputed areas" theme to match their outlook.
      Optional point-of-view (POV) variants for several dozen countries are
      offered on the 1:10m admin-0 page only; the 1:50m and 1:110m pages do
      not mention POV variants. The rights side is clear; the neutrality
      side is a cartographer task: use the 1:50m breakaway and disputed
      areas layer to render disputed zones with a neutral hatched style and
      no single-state fill, and label it. Not verified: whether the 50m and
      110m attribute tables carry per-worldview columns; data-curator should
      inspect on download. Public domain has no SPDX id, hence LicenseRef.

# Asset classes (fonts, images, audio). Entries are added by later requests.
# Each asset entry uses the source keys above plus `kind: font|image|audio`.
#
# Font conventions:
#   license      OFL-1.1-RFN when the copyright statement (OFL.txt or the font's
#                own name table) declares a Reserved Font Name, else
#                OFL-1.1-no-RFN. Both are SPDX ids for the same OFL 1.1 text.
#   share_alike  true for every OFL font: the font and any derivative must stay
#                under OFL 1.1 (condition 5). Documents and pages that merely use
#                the font are not affected.
#   RFN rule     Per OFL FAQ 2.6 to 2.8 and the SIL paper "Webfonts and Reserved
#                Font Names", pre-made subsets (including unicode-range slices)
#                and axis-instanced files are Modified Versions. A Modified
#                Version may not carry a Reserved Font Name without the holder's
#                written permission. Unmodified upstream files and pure WOFF/WOFF2
#                wrapping of unchanged font data may keep the name (FAQ 2.2.1).
assets:
  # The two entries below keep their original ids (ids never change). Each id
  # names the upstream work and its license, which are unchanged. What ships
  # changed on 2026-11-10: the blocked Fontsource slices were removed and
  # replaced by our own renamed subsets. History is kept in notes.
  - id: font-source-serif-4
    kind: font
    name: "Tongues Serif: renamed web subset of Adobe Source Serif 4 (variable wght, opsz pinned at 36, roman)"
    version: "Built by scripts/build_fonts.py from Adobe Source Serif 4 release 4.005R, asset source-serif-4.005_Desktop.zip (sha256 549fdb8f9a682bd06944298621404969f6de77c2e422ff3b8244a1dcd6a0c425), member source-serif-4.005_Desktop/VAR/SourceSerif4Variable-Roman.ttf (sha256 14d360ee1b76655da9276628b229e11671bc1f5d1083636144db6677d452cf55); fontTools 4.68.0, brotli 1.2.1; output hashes in scripts/fonts-build.lock.json"
    url: "https://github.com/adobe-fonts/source-serif/releases/tag/4.005R"
    doi: null
    license: OFL-1.1-RFN
    license_url: "https://openfontlicense.org/open-font-license-official-text/"
    attribution: >-
      Tongues Serif is a modified version of Source Serif 4 by Frank
      Grießhammer for Adobe. Copyright 2014-2023 Adobe, with Reserved Font
      Name "Source". Source is a trademark of Adobe in the United States
      and/or other countries. SIL Open Font License 1.1. Adobe does not
      endorse Tree of Tongues or this modified version.
    components:
      - "apps/web/public/fonts/tongues-serif/: 6 woff2 unicode-range slices (latin, latin-ext, cyrillic, cyrillic-ext, greek, vietnamese; no greek-ext glyphs upstream), wght axis 200 to 900, opsz fixed at 36, roman only"
      - "apps/web/public/fonts/tongues-serif/OFL.txt: LICENSE.md from inside the 4.005R zip, verbatim (sha256 75784a295293a8992f5a8d99210566e0064a012e6dab6731305e3787f15896c7 per lock)"
      - "apps/web/public/fonts/tongues-serif/FONTLOG.txt: modification note, upstream release and hashes"
      - "apps/web/src/design/fonts.tongues.css: generated @font-face rules, family 'Tongues Serif'"
    share_alike: true
    non_commercial: false
    no_derivatives: false
    restrictions:
      - "OFL 1.1 condition 2: every copy must carry the copyright notice and the license. OFL.txt and FONTLOG.txt stay beside the woff2 files and are served with them; name IDs 0, 13 and 14 stay unchanged inside every file."
      - "OFL 1.1 condition 3: Reserved Font Name 'Source'. No Modified Version may use 'Source' in the primary font name. Name IDs 1, 3, 4, 6, 16, 17, 21, 22, 25, fvar instance names and STAT names must never contain it. build_fonts.py enforces this and fails the build otherwise; keep that check."
      - "Name IDs 0 (copyright, including the RFN declaration) and 7 (trademark) must stay exactly as Adobe wrote them. Do not edit Adobe's copyright line in OFL.txt either."
      - "OFL 1.1 condition 5: Tongues Serif stays under OFL 1.1. The repo MIT and CC BY-SA licenses do not cover it (LICENSE-CONTENT.md says so)."
      - "OFL 1.1 condition 1: the font may not be sold by itself."
      - "OFL 1.1 condition 4: do not use Adobe's or Frank Grießhammer's name to promote the project or the modified font, beyond acknowledgement."
      - "Do not reintroduce Fontsource or Google Fonts slices named 'Source Serif 4' (the previously blocked build)."
    status: cleared
    verified_on: 2026-11-10
    verified_url:
      - "docs/reports/2026-11-10-overnight/font-name-tables.txt"
      - "https://github.com/adobe-fonts/source-serif/releases/tag/4.005R"
      - "https://raw.githubusercontent.com/adobe-fonts/source-serif/4.005R/LICENSE.md"
      - "https://openfontlicense.org/ofl-faq/"
      - "https://openfontlicense.org/webfonts-and-reserved-font-names/"
    notes: >-
      RFN compliant by construction, per review of scripts/build_fonts.py,
      scripts/fonts-build.lock.json, OFL.txt, FONTLOG.txt and the generated
      CSS on 2026-11-10. The family is renamed "Tongues Serif" (PostScript
      prefix TonguesSerif); every name record except IDs 0 and 7 is
      rewritten and the script exits if any of them still contains
      "Source". ID 10 and FONTLOG.txt carry the modification note; ID 5 has a
      modification suffix; IDs 16, 17, 21 and 22 are dropped; OS/2 vendor is
      "TOT ". Mentions of "Source Serif 4" in FONTLOG.txt, README.md and CSS
      comments are acknowledgement, which condition 4 permits, and are not
      the primary font name. OFL.txt first line ("Copyright 2014 - 2023 Adobe
      ... with Reserved Font Name 'Source' ... Source is a trademark of Adobe")
      matches LICENSE.md at tag 4.005R as fetched on 2026-11-10. CONDITIONS
      (why not plain cleared): rights-auditor had no shell, so the name
      tables, the input sha256 values and the byte identity of the committed
      woff2 files were not inspected directly. Before release, qa-gatekeeper
      or script-typographer must record (1) a passing `uv run python
      scripts/build_fonts.py --check` and (2) a name-table dump of
      tongues-serif-latin-wght-normal.woff2 showing no "Source" outside IDs 0
      and 7, and the ID 0 string. If ID 0 differs from the OFL.txt year
      range, both are Adobe's own statements; keep both verbatim. Status
      becomes cleared once both are recorded. CONDITIONS MET 2026-11-10: the
      orchestrator ran both checks (docs/reports/2026-11-10-overnight/font-name-tables.txt):
      --check rebuilt 15 files byte-identical to the lock, and no name
      record outside IDs 0 and 7 contains "Source". Byte identity also
      proves the shipped files passed the script's own RFN check. ID 0
      reads "© 2014 - 2023 Adobe (http://www.adobe.com/), with Reserved Font
      Name ‘Source’.", matching OFL.txt. That string comes from the
      orchestrator's message; the evidence file holds a summary, not the
      raw dump. Upgraded to cleared. HISTORY: until 2026-11-10 this
      id described @fontsource-variable/source-serif-4 5.3.1 slices, which
      kept the RFN and were blocked; those files were removed.

