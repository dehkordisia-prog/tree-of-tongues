    version: "ASJP v21 (2025); CLDF release v21.1 (Zenodo record published 2026-09-25)"
    url: "https://zenodo.org/records/22957986"
    doi: "10.5281/zenodo.22957986"
    license: CC-BY-4.0
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    attribution: >-
      The ASJP Database (version 21), edited by Søren Wichmann, Eric W.
      Holman, Cecil H. Brown, Matthew S. Dryer and Qibin Ran, 2025.
      https://asjp.clld.org. CLDF release v21.1 by lexibank, DOI
      10.5281/zenodo.22957986. CC BY 4.0. Forms are in ASJPcode.
    citation: >-
      Wichmann, Søren, Eric W. Holman, Cecil H. Brown, Matthew S. Dryer, and
      Qibin Ran (eds.). 2025. The ASJP Database (version 21).
      https://asjp.clld.org. CLDF dataset: Wichmann, Søren, Eric W. Holman
      and Cecil H. Brown. 2026. CLDF dataset derived from Wichmann et al.'s
      "ASJP Database" v21 from 2025 (v21.1). Zenodo.
      https://doi.org/10.5281/zenodo.22957986
    components:
      - "Zenodo file lexibank/asjp-v21.1.zip, 20,742,254 bytes, md5 524e275f97abc4ba633e789fa4132cfb (per Zenodo API on 2026-11-10); data-curator records sha256 in MANIFEST.yaml"
      - "cldf/forms.csv: columns Value and Form (ASJPcode), Language_ID, Parameter_ID, Source"
      - "cldf/languages.csv: ID, Name, Glottocode, ISO639P3code, Latitude, Longitude, transcribers"
      - "cldf/parameters.csv: 100 concepts mapped to Concepticon; the app uses the 40-item ASJP subset only"
      - "cldf/sources.bib: per-wordlist sources"
    share_alike: false
    non_commercial: false
    no_derivatives: false
    restrictions:
      - "CC BY 4.0: credit both the ASJP Database v21 (the editors' citation) and the CLDF release DOI, link the license, and say that we changed the format."
      - "TRANSCRIPTION LABEL: Value and Form are ASJPcode, not IPA. The UI labels them 'ASJPcode' and never 'IPA'. The pipeline never converts ASJPcode to IPA."
      - "Do not display or store the Segments column as IPA. Segments is lexibank's machine mapping of ASJPcode to CLTS/BIPA (the README reports 6 BIPA errors and 327 modified CLTS segments). Showing it as IPA would present a generated transcription as a source form. If ever used, label it 'CLTS segments generated by lexibank from ASJPcode' and get linguist-reviewer approval first."
      - "Do not ingest the classification_ethnologue column of languages.csv. Classification comes from Glottolog; the Ethnologue strings add nothing and only bring Ethnologue-derived content into our files."
      - "Per-row provenance: keep the doculect (Language_ID and Name), the Source keys from forms.csv, and the transcribers field. 12,015 of 568,820 forms have no source in the release; show those as 'no source given in ASJP', never invent one."
      - "425 of 11,540 doculects have no Glottocode. Do not guess a Glottocode for them; leave them unmapped."
