      - "https://openfontlicense.org/ofl-faq/"
    notes: >-
      Cleared as shipped. The WOFF2 is published by SIL itself, so it is an
      Original Version and may keep its name; SIL's web fonts page
      recommends copying its WOFF/WOFF2 files to your own server. OFL.txt
      matches the v7.000 tag verbatim (1997-2025). The main branch now reads
