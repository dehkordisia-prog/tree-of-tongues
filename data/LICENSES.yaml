      primary font name is "Noto Sans SC", which does not use it. OFL
      condition 3 applies only to the primary font name, so the slices may
      keep the Noto Sans SC name. Cleared. Local OFL.txt matches Google's copy
      verbatim. Reconfirmed 2026-11-10 after the Source fonts were renamed:
      the test is the same as for Tongues Sans and Tongues Serif (does the
      primary name of a Modified Version use the RFN?), and "Noto Sans SC"
      does not. A "Source" in IDs 0 or 7 is a notice, not a name, and must
      stay. Rule for the future: if anyone builds our own CJK subset from
      Adobe's Source Han Sans files, it must be renamed like Tongues Sans.
